name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  RG_VERSION: "15.1.0"

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin

          - platform: ubuntu-22.04
            args: --bundles appimage,deb

          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install macOS Rust targets
        if: matrix.platform == 'macos-latest'
        run: |
          rustup target add x86_64-apple-darwin
          rustup target add aarch64-apple-darwin

      - name: Download macOS ripgrep sidecars
        if: matrix.platform == 'macos-latest'
        run: |
          set -euo pipefail

          mkdir -p src-tauri/binaries /tmp/rg-x64 /tmp/rg-arm64

          curl -fL \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/ripgrep-${RG_VERSION}-x86_64-apple-darwin.tar.gz" \
            -o /tmp/rg-x64.tar.gz

          curl -fL \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/ripgrep-${RG_VERSION}-aarch64-apple-darwin.tar.gz" \
            -o /tmp/rg-arm64.tar.gz

          tar -xzf /tmp/rg-x64.tar.gz -C /tmp/rg-x64 --strip-components=1
          tar -xzf /tmp/rg-arm64.tar.gz -C /tmp/rg-arm64 --strip-components=1

          install -m 755 /tmp/rg-x64/rg src-tauri/binaries/rg-x86_64-apple-darwin
          install -m 755 /tmp/rg-arm64/rg src-tauri/binaries/rg-aarch64-apple-darwin

          lipo -create \
            src-tauri/binaries/rg-aarch64-apple-darwin \
            src-tauri/binaries/rg-x86_64-apple-darwin \
            -output src-tauri/binaries/rg-universal-apple-darwin

          chmod +x src-tauri/binaries/rg-universal-apple-darwin

          src-tauri/binaries/rg-universal-apple-darwin --version

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.8.0
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Download Windows ripgrep sidecar
        if: matrix.platform == 'windows-latest'
        shell: bash
        run: |
          set -euo pipefail

          RG_TARGET="x86_64-pc-windows-msvc"
          RG_ARCHIVE="ripgrep-${RG_VERSION}-${RG_TARGET}.zip"

          mkdir -p src-tauri/binaries

          curl -fL \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_ARCHIVE}" \
            -o "/tmp/${RG_ARCHIVE}"

          unzip -q "/tmp/${RG_ARCHIVE}" -d /tmp/rg

          RG_EXE="$(find /tmp/rg -type f -name rg.exe -print -quit)"
          install -Dm755 "$RG_EXE" "src-tauri/binaries/rg-${RG_TARGET}.exe"

          "src-tauri/binaries/rg-${RG_TARGET}.exe" --version

      - name: Download Linux ripgrep sidecar
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euo pipefail

          RG_DOWNLOAD_TARGET="x86_64-unknown-linux-musl"
          RG_TAURI_TARGET="x86_64-unknown-linux-gnu"
          RG_ARCHIVE="ripgrep-${RG_VERSION}-${RG_DOWNLOAD_TARGET}.tar.gz"

          mkdir -p src-tauri/binaries

          curl -fL \
            "https://github.com/BurntSushi/ripgrep/releases/download/${RG_VERSION}/${RG_ARCHIVE}" \
            -o "/tmp/${RG_ARCHIVE}"

          mkdir -p /tmp/rg
          tar -xzf "/tmp/${RG_ARCHIVE}" -C /tmp/rg --strip-components=1

          install -Dm755 /tmp/rg/rg "src-tauri/binaries/rg-${RG_TAURI_TARGET}"

          file "src-tauri/binaries/rg-${RG_TAURI_TARGET}"
          ldd "src-tauri/binaries/rg-${RG_TAURI_TARGET}" || true
          "src-tauri/binaries/rg-${RG_TAURI_TARGET}" --version

      - name: Find all rg binaries before build
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euo pipefail
      
          echo "Repo sidecar:"
          sha256sum src-tauri/binaries/rg-x86_64-unknown-linux-gnu
          file src-tauri/binaries/rg-x86_64-unknown-linux-gnu
      
          echo "PATH rg:"
          command -v rg || true
          if command -v rg >/dev/null 2>&1; then
            file "$(command -v rg)"
            sha256sum "$(command -v rg)"
            rg --version
          fi
      
          echo "All likely rg files:"
          find /home/runner/work /usr/bin /usr/local/bin /opt -type f -name 'rg*' \
            -exec sh -c 'echo "---- $1"; file "$1"; sha256sum "$1"; "$1" --version 2>/dev/null || true' sh {} \; \
            2>/dev/null || true

      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Searchmonkey III ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install this version."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Build RPM using the system ripgrep package
        if: matrix.platform == 'ubuntu-22.04'
        run: pnpm tauri build --bundles rpm --config src-tauri/tauri.rpm.conf.json

      - name: Verify RPM does not own rg
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euo pipefail

          rpm_file="$(find src-tauri/target/release/bundle/rpm -type f -name '*.rpm' -print -quit)"
          test -n "$rpm_file"

          if rpm -qpl "$rpm_file" | grep -Fx /usr/bin/rg; then
            echo "RPM must not install /usr/bin/rg" >&2
            exit 1
          fi

          rpm -qpR "$rpm_file" | grep -Fx ripgrep

      - name: Upload RPM
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          rpm_file="$(find src-tauri/target/release/bundle/rpm -type f -name '*.rpm' -print -quit)"
          gh release upload "${{ github.ref_name }}" "$rpm_file" --clobber

      - name: Find b292 rg after AppImage build
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euo pipefail
      
          echo "All rg-like files after build:"
          find src-tauri/target /tmp /home/runner/work -type f -name 'rg*' \
            -exec sh -c 'echo "---- $1"; file "$1"; sha256sum "$1"; "$1" --version 2>/dev/null || true' sh {} \; \
            2>/dev/null || true
      
          appimage="$(find src-tauri/target/release/bundle/appimage -type f -name '*.AppImage' -print -quit)"
          rm -rf squashfs-root
          chmod +x "$appimage"
          "$appimage" --appimage-extract >/dev/null
      
          echo "AppImage rg:"
          find squashfs-root -type f -name 'rg*' \
            -exec sh -c 'echo "---- $1"; file "$1"; sha256sum "$1"; "$1" --version 2>/dev/null || true' sh {} \;

      - name: Repack patched AppImage
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euo pipefail
      
          appdir="src-tauri/target/release/bundle/appimage/Searchmonkey.AppDir"
          appimage="src-tauri/target/release/bundle/appimage/Searchmonkey_${GITHUB_REF_NAME#v}_amd64.AppImage"
          good_rg="src-tauri/binaries/rg-x86_64-unknown-linux-gnu"

          install -Dm755 "$good_rg" "$appdir/usr/bin/rg"

          echo "Patched AppDir rg:"
          sha256sum "$good_rg"
          sha256sum "$appdir/usr/bin/rg"
          "$appdir/usr/bin/rg" --version
      
          curl -fL \
            "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -o /tmp/appimagetool.AppImage
      
          chmod +x /tmp/appimagetool.AppImage
      
          cd /tmp
          /tmp/appimagetool.AppImage --appimage-extract >/dev/null
          cd -
      
          rm -f "$appimage"
          ARCH=x86_64 /tmp/squashfs-root/AppRun "$appdir" "$appimage"
      
          chmod +x "$appimage"
          rm -rf squashfs-root
          "$appimage" --appimage-extract >/dev/null
      
          sha256sum squashfs-root/usr/bin/rg
          squashfs-root/usr/bin/rg --version

      - name: Upload patched AppImage
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" \
            src-tauri/target/release/bundle/appimage/Searchmonkey_${GITHUB_REF_NAME#v}_amd64.AppImage \
            --clobber

      - name: Package Linux tarball
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euo pipefail

          bundle_dir="dist/searchmonkey"
          mkdir -p "$bundle_dir/icons"

          app_binary=""
          for candidate in \
            src-tauri/target/release/searchmonkey \
            src-tauri/target/release/tauri-app
          do
            if [ -f "$candidate" ]; then
              app_binary="$candidate"
              break
            fi
          done

          rg_binary="src-tauri/binaries/rg-x86_64-unknown-linux-gnu"
          
          if [ ! -x "$rg_binary" ]; then
            echo "No executable Linux rg sidecar found: $rg_binary" >&2
            exit 1
          fi
          
          "$rg_binary" --version

          install -Dm755 "$app_binary" "$bundle_dir/searchmonkey"
          install -Dm755 "$rg_binary" "$bundle_dir/rg"
          cp -R src-tauri/icons/. "$bundle_dir/icons/"

          desktop_file="$(find src-tauri/target/release/bundle -path '*/deb/*' -type f -name '*.desktop' -print -quit)"
          if [ -z "$desktop_file" ]; then
            desktop_file="$(find src-tauri/target/release/bundle -type f -name '*.desktop' ! -path '*/appimage/*' -print -quit)"
          fi
          if [ -z "$desktop_file" ]; then
            desktop_file="$(find src-tauri/target/release/bundle -type f -name '*.desktop' -print -quit)"
          fi

          if [ -z "$desktop_file" ]; then
            echo "No desktop file found in src-tauri/target/release/bundle" >&2
            exit 1
          fi

          cp "$desktop_file" "$bundle_dir/uk.co.axonara.searchmonkey.desktop"

          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cat > "$bundle_dir/uk.co.axonara.searchmonkey.metainfo.xml" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <component type="desktop-application">
            <id>uk.co.axonara.searchmonkey</id>
            <metadata_license>MIT</metadata_license>
            <project_license>MIT</project_license>
            <name>Searchmonkey</name>
            <summary>Search files and folders</summary>
            <description>
              <p>Searchmonkey is a desktop search tool for finding text in files and folders.</p>
            </description>
            <launchable type="desktop-id">uk.co.axonara.searchmonkey.desktop</launchable>
            <releases>
              <release version="$version" date="$(date -u +%F)" />
            </releases>
          </component>
          EOF

          tar -C dist -czf Searchmonkey_linux_x86_64.tar.gz searchmonkey

      - name: Upload Linux tarball
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" Searchmonkey_linux_x86_64.tar.gz --clobber
