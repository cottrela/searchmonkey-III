name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin

          - platform: ubuntu-22.04
            args: ""

          - platform: windows-latest
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install macOS Rust targets
        if: matrix.platform == 'macos-latest'
        run: |
          rustup target add x86_64-apple-darwin
          rustup target add aarch64-apple-darwin

      - name: Build universal rg binary
        if: matrix.platform == 'macos-latest'
        run: |
          lipo -create \
            src-tauri/binaries/rg-aarch64-apple-darwin \
            src-tauri/binaries/rg-x86_64-apple-darwin \
            -output src-tauri/binaries/rg-universal-apple-darwin
          chmod +x src-tauri/binaries/rg-universal-apple-darwin

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and publish Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Searchmonkey III ${{ github.ref_name }}"
          releaseBody: "See the assets below to download and install this version."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      - name: Package Linux tarball
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -euo pipefail

          bundle_dir="dist/searchmonkey"
          mkdir -p "$bundle_dir/icons"

          app_binary=""
          for candidate in \
            src-tauri/target/release/searchmonkey \
            src-tauri/target/release/tauri-app
          do
            if [ -f "$candidate" ]; then
              app_binary="$candidate"
              break
            fi
          done

          rg_binary=""
          for candidate in \
            src-tauri/target/release/rg \
            src-tauri/binaries/rg-x86_64-unknown-linux-gnu
          do
            if [ -f "$candidate" ]; then
              rg_binary="$candidate"
              break
            fi
          done

          if [ -z "$app_binary" ]; then
            echo "No app binary found in src-tauri/target/release" >&2
            exit 1
          fi

          if [ -z "$rg_binary" ]; then
            echo "No rg sidecar found in src-tauri/target/release or src-tauri/binaries" >&2
            exit 1
          fi

          install -Dm755 "$app_binary" "$bundle_dir/searchmonkey"
          install -Dm755 "$rg_binary" "$bundle_dir/rg"
          cp -R src-tauri/icons/. "$bundle_dir/icons/"

          desktop_file="$(find src-tauri/target/release/bundle -type f -name '*.desktop' -print -quit)"
          metainfo_file="$(find src-tauri/target/release/bundle -type f \( -name '*.metainfo.xml' -o -name '*.appdata.xml' \) -print -quit)"

          if [ -z "$desktop_file" ]; then
            echo "No desktop file found in src-tauri/target/release/bundle" >&2
            exit 1
          fi

          if [ -z "$metainfo_file" ]; then
            echo "No metainfo/appdata file found in src-tauri/target/release/bundle" >&2
            exit 1
          fi

          cp "$desktop_file" "$bundle_dir/uk.co.axanara.searchmonkey.desktop"
          cp "$metainfo_file" "$bundle_dir/uk.co.axanara.searchmonkey.metainfo.xml"

          tar -C dist -czf Searchmonkey_linux_x86_64.tar.gz searchmonkey

      - name: Upload Linux tarball
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "${{ github.ref_name }}" Searchmonkey_linux_x86_64.tar.gz --clobber
