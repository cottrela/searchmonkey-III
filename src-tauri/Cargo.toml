[package]
name = "searchmonkey"
version = "0.2.3"
description = "Searchmonkey desktop search application"
authors = ["Adam Cottrell <adam@searchmonkey.dev>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# Keep this pattern to avoid Windows conflicts
name = "searchmonkey_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
async-trait = "0.1"
grep = "0.3"
ignore = "0.4"
libc = "0.2"
